name: Deploy animation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Prepare static site
        run: |
          mkdir -p _site/vendor
          cp animation/index.html animation/app.js animation/models.js animation/style.css animation/cost-model.js animation/costs.js animation/costs.css _site/
          cp animation/vendor/three.min.js animation/vendor/LICENSE _site/vendor/
          cp output/animation/climbing-wall-process.mp4 _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
